[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-ligand-binding-models"
version = "0.1.0"
description = "Protein-ligand binding models for native mass spectrometry titrations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6", "openpyxl>=3.1"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
protein-ligand-fit = "scripts_binding.core.runner:main"
protein-ligand-simulate = "scripts_binding.scripts.simulate:main"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
include = ["scripts_binding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
